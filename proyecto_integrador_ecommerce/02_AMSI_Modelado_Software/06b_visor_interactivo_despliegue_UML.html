const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svgView');
const tabBar = document.getElementById('tabBar');
let curIdx = 0, scale = 0.8, tx = 20, ty = 15, dragging = false, sx = 0, sy = 0;

function el(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); if (parent) parent.appendChild(n); return n; }
function addText(parent, x, y, text, size, weight, fill) {
  const lines = text.split('\n');
  const t = el('text', { x, y: y - ((lines.length - 1) * (size + 2)) / 2, 'text-anchor': 'middle', 'font-size': size, 'font-weight': weight, fill }, parent);
  lines.forEach((ln, i) => { const ts = el('tspan', { x, dy: i === 0 ? 0 : (size + 3) }, t); ts.textContent = ln.replace('<<', '«').replace('>>', '»'); });
}

function renderPage(idx) {
  curIdx = idx;
  const p = PAGES[idx];
  svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  const m1 = el('marker', { id: 'm-solid', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
  el('path', { d: 'M 0 1 L 10 5 L 0 9 Z', fill: '#334155' }, m1);
  const m2 = el('marker', { id: 'm-dash', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
  el('path', { d: 'M 1 1 L 9 5 L 1 9', fill: 'none', stroke: '#B45309', 'stroke-width': 1.6 }, m2);

  const scene = el('g', { id: 'scene' }, svg);
  el('rect', { x: 0, y: 0, width: p.W, height: p.H, fill: '#F8FAFC' }, scene);
  el('rect', { x: 30, y: 16, width: p.W - 60, height: 78, rx: 10, fill: p.Color }, scene);
  addText(scene, p.W / 2, 46, p.Title, 15.5, '700', '#FFFFFF');
  addText(scene, p.W / 2, 74, p.Sub, 11.5, '400', '#BAE6FD');

  p.Groups.forEach(g => {
    el('rect', { x: g.X, y: g.Y, width: g.W, height: g.H, rx: 8, fill: g.Bg, stroke: g.Color, 'stroke-width': 1.8 }, scene);
    el('rect', { x: g.X, y: g.Y, width: g.W, height: 26, rx: 8, fill: g.Color }, scene);
    const gt = el('text', { x: g.X + 12, y: g.Y + 17, fill: '#fff', 'font-size': 11.5, 'font-weight': '700' }, scene); gt.textContent = g.Label;
  });

  const gEdges = el('g', {}, scene);
  const gNodes = el('g', {}, scene);
  const map = {};
  p.Nodes.forEach(n => {
    map[n.Id] = n;
    el('rect', { x: n.X, y: n.Y, width: n.W, height: n.H, rx: n.Kind === 'db' ? 12 : 6, fill: n.Fill, stroke: n.Stroke, 'stroke-width': 1.8 }, gNodes);
    if (n.Kind === 'comp') {
      el('rect', { x: n.X - 6, y: n.Y + 10, width: 12, height: 8, fill: n.Fill, stroke: n.Stroke, 'stroke-width': 1.4 }, gNodes);
      el('rect', { x: n.X - 6, y: n.Y + 24, width: 12, height: 8, fill: n.Fill, stroke: n.Stroke, 'stroke-width': 1.4 }, gNodes);
    }
    addText(gNodes, n.X + n.W / 2, n.Y + n.H / 2 + 4, n.Label, 10.5, '700', '#0F172A');
  });

  p.Edges.forEach(e => {
    const s = map[e.S], t = map[e.T]; if (!s || !t) return;
    const x1 = s.X + s.W / 2, y1 = s.Y + s.H / 2, x2 = t.X + t.W / 2, y2 = t.Y + t.H / 2;
    const isDash = e.Kind === 'dash';
    const attrs = { x1, y1, x2, y2, stroke: isDash ? '#B45309' : '#334155', 'stroke-width': 1.5, 'marker-end': isDash ? 'url(#m-dash)' : 'url(#m-solid)' };
    if (isDash) attrs['stroke-dasharray'] = '6,4';
    el('line', attrs, gEdges);
    if (e.Label) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 4;
      el('rect', { x: mx - 42, y: my - 9, width: 84, height: 13, rx: 3, fill: '#fff', opacity: 0.9 }, gEdges);
      const lt = el('text', { x: mx, y: my + 1, 'text-anchor': 'middle', 'font-size': 9.5, 'font-weight': '600', fill: attrs.stroke }, gEdges); lt.textContent = e.Label;
    }
  });

  fitView();
  document.querySelectorAll('#tabBar button.tab').forEach((b, i) => b.classList.toggle('active', i === idx));
}

function updateTransform() { const sc = svg.querySelector('#scene'); if (sc) sc.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')'); }
function fitView() { const p = PAGES[curIdx], r = svg.getBoundingClientRect(); scale = Math.min((r.width - 30) / p.W, (r.height - 30) / p.H); tx = (r.width - p.W * scale) / 2; ty = (r.height - p.H * scale) / 2; updateTransform(); }
function exportSvg() {
  const p = PAGES[curIdx], clone = svg.cloneNode(true);
  clone.setAttribute('width', p.W); clone.setAttribute('height', p.H); clone.setAttribute('viewBox', '0 0 ' + p.W + ' ' + p.H);
  clone.querySelector('#scene').setAttribute('transform', 'translate(0,0) scale(1)');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' }));
  a.download = 'DERMA_ECOM_' + p.Id.toUpperCase() + '.svg';
  a.click();
}

PAGES.forEach((p, i) => { const b = document.createElement('button'); b.className = 'tab'; b.textContent = p.Name; b.onclick = () => renderPage(i); tabBar.appendChild(b); });
const ex = document.createElement('button'); ex.className = 'export'; ex.textContent = 'Exportar SVG'; ex.onclick = exportSvg; tabBar.appendChild(ex);
svg.addEventListener('wheel', e => { e.preventDefault(); const f = e.deltaY < 0 ? 1.15 : 0.87, r = svg.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top; tx = mx - (mx - tx) * f; ty = my - (my - ty) * f; scale *= f; updateTransform(); }, { passive: false });
svg.addEventListener('mousedown', e => { dragging = true; sx = e.clientX - tx; sy = e.clientY - ty; });
window.addEventListener('mousemove', e => { if (!dragging) return; tx = e.clientX - sx; ty = e.clientY - sy; updateTransform(); });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('resize', fitView);
renderPage(0);
</script>
