let curIdx=0,scale=0.8,tx=20,ty=15,drag=false,sx=0,sy=0;
const el=(t,a,p)=>{const n=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a||{}))n.setAttribute(k,v);if(p)p.appendChild(n);return n;};
const txt=(p,x,y,s,sz,w,f,ul)=>{const ls=s.split('\n'),t=el('text',{x,y:y-((ls.length-1)*(sz+2))/2,'text-anchor':'middle','font-size':sz,'font-weight':w,fill:f,'text-decoration':ul?'underline':'none'},p);ls.forEach((l,i)=>{const ts=el('tspan',{x,dy:i?sz+3:0},t);ts.textContent=l;});};
function render(i){curIdx=i;const p=PAGES[i];svg.innerHTML='';
const sc=el('g',{id:'scene'},svg);el('rect',{x:0,y:0,width:p.W,height:p.H,fill:'#F8FAFC'},sc);el('rect',{x:30,y:16,width:p.W-60,height:78,rx:10,fill:p.Color},sc);txt(sc,p.W/2,46,p.Title,15,'700','#fff');txt(sc,p.W/2,74,p.Sub,11.5,'400','#BAE6FD');

p.Objects.forEach(o=>{map[o.Id]=o;el('rect',{x:o.X,y:o.Y,width:o.W,height:o.H,rx:2,fill:o.Fill,stroke:o.Stroke,'stroke-width':2},gN);txt(gN,o.X+o.W/2,o.Y+o.H/2+4,o.Label,11.5,'700','#0F172A',true);});

fit();document.querySelectorAll('#tabBar button.tab').forEach((b,k)=>b.classList.toggle('active',k===i));}
const upd=()=>{const s=svg.querySelector('#scene');if(s)s.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);};

const exp=()=>{const p=PAGES[curIdx],c=svg.cloneNode(true);c.setAttribute('width',p.W);c.setAttribute('height',p.H);c.setAttribute('viewBox',`0 0 ${p.W} ${p.H}`);c.querySelector('#scene').setAttribute('transform','translate(0,0) scale(1)');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml'}));a.download=`DERMA_ECOM_UML_${p.Id.toUpperCase()}.svg`;a.click();};

const eb=document.createElement('button');eb.className='export';eb.textContent='Exportar SVG';eb.onclick=exp;tabBar.appendChild(eb);
svg.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.15:0.87,r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;scale*=f;upd();},{passive:false});
svg.addEventListener('mousedown',e=>{drag=true;sx=e.clientX-tx;sy=e.clientY-ty;});window.addEventListener('mousemove',e=>{if(!drag)return;tx=e.clientX-sx;ty=e.clientY-sy;upd();});window.addEventListener('mouseup',()=>drag=false);window.addEventListener('resize',fit);render(0);
