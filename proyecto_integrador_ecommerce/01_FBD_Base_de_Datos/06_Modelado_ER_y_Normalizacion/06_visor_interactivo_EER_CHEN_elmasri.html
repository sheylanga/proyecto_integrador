el('text', { x: lx[8]+25, y: 3236, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 'bold', fill: '#7f1d1d' }, gBg).textContent = 'd';
el('circle', { cx: lx[8]+70, cy: 3231, r: 17, fill: '#e0e7ff', stroke: '#3730a3', 'stroke-width': 2 }, gBg);
el('text', { x: lx[8]+70, y: 3236, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 'bold', fill: '#1e1b4b' }, gBg).textContent = 'o';
el('text', { x: lx[8]+148, y: 3235, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 'bold', fill: '#1e293b' }, gBg).textContent = 'Disjunta / Solapada';
// 10 Participation
el('line', { x1: lx[9], y1: 3223, x2: lx[9]+55, y2: 3223, stroke: '#9d174d', 'stroke-width': 4 }, gBg);
el('line', { x1: lx[9], y1: 3223, x2: lx[9]+55, y2: 3223, stroke: '#fffbeb', 'stroke-width': 1.4 }, gBg);
el('text', { x: lx[9]+65, y: 3227, 'font-size': 11, 'font-weight': 'bold', fill: '#831843' }, gBg).textContent = 'Participación Total (doble)';
el('line', { x1: lx[9], y1: 3244, x2: lx[9]+55, y2: 3244, stroke: '#dc2626', 'stroke-width': 1.5, 'stroke-dasharray': '6,4' }, gBg);
el('text', { x: lx[9]+65, y: 3248, 'font-size': 11, 'font-weight': 'bold', fill: '#b91c1c' }, gBg).textContent = 'Vínculo Inter-Dominio';

const nmap = {};
D.nodes.forEach(n => nmap[n.Id] = n);

// Render Edges
D.edges.forEach(e => {
  const s = nmap[e.S], t = nmap[e.T];
  if (!s || !t) return;
  const x1 = s.X + s.W/2, y1 = s.Y + s.H/2, x2 = t.X + t.W/2, y2 = t.Y + t.H/2;
  if (e.Style === 'double') {
    el('line', { x1, y1, x2, y2, stroke: '#9d174d', 'stroke-width': 5 }, gEd);
    el('line', { x1, y1, x2, y2, stroke: '#ffffff', 'stroke-width': 1.8 }, gEd);
  } else if (e.Style === 'dashed') {
    el('line', { x1, y1, x2, y2, stroke: '#dc2626', 'stroke-width': 1.5, 'stroke-dasharray': '6,4', 'marker-end': 'url(#arr-dash)' }, gEd);
  } else if (e.Style === 'eer_sub') {
    el('line', { x1, y1, x2, y2, stroke: '#3730a3', 'stroke-width': 2, 'marker-end': 'url(#arr-sub)' }, gEd);
  } else {
    el('line', { x1, y1, x2, y2, stroke: '#475569', 'stroke-width': 1.5 }, gEd);
  }
  if (e.Lbl) {
    const mx = (x1 + x2)/2, my = (y1 + y2)/2;
    const bg = el('rect', { x: mx - 24, y: my - 9, width: 48, height: 16, rx: 4, fill: 'rgba(255,255,255,0.88)' }, gEd);
    const lb = el('text', { x: mx, y: my + 3, 'text-anchor': 'middle', 'font-size': e.Style==='eer_sub'?13:10, 'font-weight': 'bold', fill: e.Style==='dashed'?'#b91c1c':(e.Style==='eer_sub'?'#312e81':'#0f172a') }, gEd);
    lb.textContent = e.Lbl;
  }
});

// Render Authentic Chen Shapes
D.nodes.forEach(n => {
  const cx = n.X + n.W/2, cy = n.Y + n.H/2;
  const g = el('g', {}, gNd);
  if (n.Kind === 'strong') {
    el('rect', { x: n.X, y: n.Y, width: n.W, height: n.H, fill: '#dbeafe', stroke: '#1e3a8a', 'stroke-width': 2 }, g);
    el('text', { x: cx, y: cy + 4, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 'bold', fill: '#0f172a' }, g).textContent = n.Label;
  } else if (n.Kind === 'weak') {
    el('rect', { x: n.X, y: n.Y, width: n.W, height: n.H, fill: '#fef3c7', stroke: '#92400e', 'stroke-width': 2 }, g);
    el('rect', { x: n.X + 4, y: n.Y + 4, width: n.W - 8, height: n.H - 8, fill: 'none', stroke: '#92400e', 'stroke-width': 1.4 }, g);
    el('text', { x: cx, y: cy + 4, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 'bold', fill: '#0f172a' }, g).textContent = n.Label;
  } else if (n.Kind === 'rel' || n.Kind === 'rel_id') {
    const pts = cx+','+n.Y+' '+(n.X+n.W)+','+cy+' '+cx+','+(n.Y+n.H)+' '+n.X+','+cy;
    el('polygon', { points: pts, fill: n.Kind==='rel_id'?'#fce7f3':'#dcfce7', stroke: n.Kind==='rel_id'?'#9d174d':'#166534', 'stroke-width': 2 }, g);
    if (n.Kind === 'rel_id') {
      const pts2 = cx+','+(n.Y+5)+' '+(n.X+n.W-8)+','+cy+' '+cx+','+(n.Y+n.H-5)+' '+(n.X+8)+','+cy;
      el('polygon', { points: pts2, fill: 'none', stroke: '#9d174d', 'stroke-width': 1.3 }, g);
    }
    el('text', { x: cx, y: cy + 3, 'text-anchor': 'middle', 'font-size': 9.5, 'font-weight': 'bold', fill: n.Kind==='rel_id'?'#500724':'#052e16' }, g).textContent = n.Label;
  } else if (n.Kind === 'eer_d' || n.Kind === 'eer_o') {
    el('circle', { cx, cy, r: n.W/2, fill: n.Kind==='eer_d'?'#fee2e2':'#e0e7ff', stroke: n.Kind==='eer_d'?'#991b1b':'#3730a3', 'stroke-width': 2.2 }, g);
    el('text', { x: cx, y: cy + 5, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 'bold', fill: n.Kind==='eer_d'?'#7f1d1d':'#1e1b4b' }, g).textContent = n.Label;
  } else {
    // Attributes (ovals)
    const rx = n.W/2, ry = n.H/2;
    const fill = n.Kind==='attr_pk'?'#fff7ed':(n.Kind==='attr_partial'?'#fefce8':(n.Kind==='attr_multi'?'#f3e8ff':(n.Kind==='attr_derived'?'#ecfeff':'#ffffff')));
    const stroke = n.Kind==='attr_pk'?'#c2410c':(n.Kind==='attr_partial'?'#a16207':(n.Kind==='attr_multi'?'#6b21a8':(n.Kind==='attr_derived'?'#0e7490':'#475569')));
    const ea = { cx, cy, rx, ry, fill, stroke, 'stroke-width': n.Kind==='attr' ? 1.3 : 1.7 };
    if (n.Kind === 'attr_derived') ea['stroke-dasharray'] = '5,3';
    el('ellipse', ea, g);
    if (n.Kind === 'attr_multi') el('ellipse', { cx, cy, rx: rx-4, ry: ry-4, fill: 'none', stroke, 'stroke-width': 1.2 }, g);
    const ta = { x: cx, y: cy + 3, 'text-anchor': 'middle', 'font-size': 10, fill: '#0f172a' };
    if (n.Kind === 'attr_pk') { ta['font-weight'] = 'bold'; ta['text-decoration'] = 'underline'; ta.fill = '#7c2d12'; }
    if (n.Kind === 'attr_partial') { ta['font-weight'] = 'bold'; ta.fill = '#713f12'; }
    if (n.Kind === 'attr_multi') { ta['font-weight'] = 'bold'; ta.fill = '#3b0764'; }
    if (n.Kind === 'attr_derived') { ta['font-style'] = 'italic'; ta.fill = '#164e63'; }
    el('text', ta, g).textContent = n.Label;
    if (n.Kind === 'attr_partial') {
      el('line', { x1: cx - rx*0.65, y1: cy + 7, x2: cx + rx*0.65, y2: cy + 7, stroke: '#713f12', 'stroke-width': 1.2, 'stroke-dasharray': '3,2' }, g);
    }
  }
});

// Pan & Zoom
let scale = 0.35, tx = 20, ty = 15, drag = false, sx = 0, sy = 0;
function upd() { scene.setAttribute('transform', 'translate('+tx+','+ty+') scale('+scale+')'); }
function fitView() {
  const r = svg.getBoundingClientRect();
  scale = Math.min((r.width - 30) / D.W, (r.height - 30) / D.H);
  tx = (r.width - D.W * scale) / 2; ty = (r.height - D.H * scale) / 2; upd();
}
function zoomBy(f) { const r = svg.getBoundingClientRect(); const cx = r.width/2, cy = r.height/2; tx = cx - (cx-tx)*f; ty = cy - (cy-ty)*f; scale *= f; upd(); }
svg.addEventListener('wheel', e => { e.preventDefault(); const f = e.deltaY<0?1.15:0.87; const r = svg.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top; tx=mx-(mx-tx)*f; ty=my-(my-ty)*f; scale*=f; upd(); }, { passive: false });
svg.addEventListener('mousedown', e => { drag = true; sx = e.clientX - tx; sy = e.clientY - ty; });
window.addEventListener('mousemove', e => { if (!drag) return; tx = e.clientX - sx; ty = e.clientY - sy; upd(); });
window.addEventListener('mouseup', () => drag = false);
function exportSvg() {
  const c = svg.cloneNode(true);
  c.setAttribute('width', D.W); c.setAttribute('height', D.H); c.setAttribute('viewBox', '0 0 '+D.W+' '+D.H);
  c.querySelector('#scene').setAttribute('transform', 'translate(0,0) scale(1)');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)], { type: 'image/svg+xml;charset=utf-8' }));
  a.download = 'DERMA_ECOM_MODELO_CONCEPTUAL_CHEN_EER.svg'; a.click();
}
fitView();
</script>
</body>
</html>
